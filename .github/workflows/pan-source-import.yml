name: Import PAN complete source
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore verified source bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, lzma, tarfile
          parts = sorted(Path('imports').glob('pan-source-*.b64'))
          assert len(parts) == 7, f"expected 7 source chunks, got {len(parts)}"
          encoded = ''.join(part.read_text(encoding='ascii').strip() for part in parts)
          payload = base64.b64decode(encoded,validate=True)
          # SHA256 is supplied in imports/SHA256SUMS after upload.
          expected = Path('imports/pan-source.sha256').read_text(encoding='ascii').strip()
          assert hashlib.sha256(payload).hexdigest() == expected, "source archive digest mismatch"
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(payload)),mode='r:') as tar:
              for member in tar:
                  path = Path(member.name)
                  assert not path.is_absolute() and '..' not in path.parts and (member.isfile() or member.isdir()),member.name
                  assert path.parts[0] not in ('imports','.github','storage') or path.as_posix() in ('storage/.gitkeep','storage/.htaccess'),member.name
              tar.extractall('.',filter='data')
          for part in parts: part.unlink()
          Path('imports/pan-source.sha256').unlink()
          assert Path('VERSION').read_text(encoding='utf-8').strip() == '2.5.1'
          print("Imported",len(parts),"PAN source chunks")
          PY
      - name: Test restored PAN source
        run: |
          python3 -m unittest discover -s tests
          node --test connectors/shopee-extension/test/recent.test.mjs
          find . -type f -name '*.php' -not -path '*/node_modules/*' -print0 | xargs -0 -n 1 php -l >/dev/null
      - name: Commit full source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import PAN 2.5.1 complete source and regression tests"
            git push origin HEAD:main
          fi
