name: PAN CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: PHP, browser extension and SQLite regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Version and JSON contract
        run: |
          test "$(cat VERSION)" = "2.5.1"
          node -e "const m=require('./connectors/shopee-extension/manifest.json'); if(m.version!=='2.4.9') process.exit(1)"
      - name: PHP syntax (all files)
        run: |
          find . -type f -name '*.php' -not -path '*/node_modules/*' -print0 | xargs -0 -n 1 php -l
      - name: JavaScript syntax and regression
        run: |
          node --check connectors/shopee-extension/background.js
          node --check connectors/shopee-extension/popup.js
          node --test connectors/shopee-extension/test/recent.test.mjs
      - name: Product category queue SQLite regression
        run: python3 -m unittest discover -s tests -v
      - name: Verify source safety
        run: |
          test ! -e storage/config.php
          test ! -d connectors/shopee-server/node_modules
          test -z "$(find . -type f \( -name '*.sqlite' -o -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.pyc' \) -print -quit)"
  browser:
    name: Shopee server connector with real Chromium fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: connectors/shopee-server/package-lock.json
      - name: Install server connector
        working-directory: connectors/shopee-server
        run: npm ci
      - name: Install Playwright Chromium for browser persistence regression
        working-directory: connectors/shopee-server
        run: npx playwright install --with-deps chromium
      - name: Run server connector tests
        working-directory: connectors/shopee-server
        run: npm test
